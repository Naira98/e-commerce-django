<h2 class="text-xl font-semibold mb-4">Categories</h2>
<ul class="space-y-2">
  <li>
    <a
      href="{% url 'products' %}"
      class="text-gray-700 hover:text-yellow-400 transition"
      >All</a
    >
  </li>
  {% for category in products.categories.all %}
  <li>
    <a
      href="{% url 'products_by_category' category.id %}"
      class="text-gray-700 hover:text-yellow-400 transition"
    >
      {{ category.name }}
    </a>
  </li>
  {% endfor %}
</ul>
