{% load static %}

<div
  class="group relative border rounded-lg overflow-hidden shadow-sm hover:shadow-md transition-shadow bg-white 
  {% if home_page %} max-w-[280px] {% else %} max-w-[300px] {% endif %}"
>
  <!-- Product Image -->
  <img
    src="{{ product.image.url }}"
    alt="{{ product.name }}"
    class="w-full object-cover transition-transform duration-300
      {% if home_page %}
        object-contain h-64 group-hover:scale-105
      {% else %}
        h-64
      {% endif %}"
  />

  <!-- Hover Actions -->
  <div
    class="absolute inset-0 bg-black bg-opacity-40 flex items-center justify-center gap-2 opacity-0 group-hover:opacity-100 transition-opacity"
  >
    {% if request.user.is_authenticated %}
      <!-- Add to Cart -->
      <button
        title="Add to Cart"
        class="bg-white text-black w-10 h-10 flex items-center justify-center rounded-full hover:text-yellow-400 hover:bg-gray-100 transition"
      >
        <i class="fa-solid fa-cart-shopping text-base"></i>
      </button>

      <!-- Add to Favorites -->
      <button
        title="Add to Favorites"
        class="favorite-btn bg-white text-black w-10 h-10 flex items-center justify-center rounded-full hover:text-yellow-400 hover:bg-gray-100 transition"
        data-product-id="{{ product.id }}"
        aria-label="Toggle favorite"
      >
        {% if product in request.user.favorites.all %}
          <i class="fa-solid fa-heart text-base text-yellow-400"></i>
        {% else %}
          <i class="fa-regular fa-heart text-base"></i>
        {% endif %}
      </button>


    {% endif %}

    <!-- View Info (always visible) -->
    <a
      href="{% url 'product_details' product.id %}"
      title="View Info"
      class="bg-white text-black w-10 h-10 flex items-center justify-center rounded-full hover:text-yellow-400 hover:bg-gray-100 transition"
    >
      <i class="fa-solid fa-circle-info text-base"></i>
    </a>
  </div>


  {% if not home_page %}
    <!-- Product Info (hidden on homepage) -->
    <div class="p-3 text-center">
      <h3 class="font-medium mb-1 text-sm">{{ product.name }}</h3>
      <p class="text-gray-700 text-xs">${{ product.price }}</p>
    </div>
  {% endif %}
</div>
