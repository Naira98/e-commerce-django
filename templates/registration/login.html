{% extends "base.html" %}

{% block title %}Login{% endblock %}

{% block body %}
{% include 'components/navbar.html' %}

<div class="max-w-xl mx-auto mt-12 p-6 bg-gray-100 rounded-lg shadow-lg">
  <h2 class="text-3xl font-bold mb-6 text-center text-gray-900">Login</h2>

  <form method="post" class="space-y-4">
    {% csrf_token %}
    {% if form.errors %}
      <div class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded relative" role="alert">
        <strong class="font-bold">Error!</strong>
        <span class="block sm:inline">Please check your username and password.</span>
      </div>
    {% endif %}

    <div>
      <label for="id_username" class="block text-gray-700 font-semibold mb-1">Username</label>
      <input
        type="text"
        name="username"
        id="id_username"
        class="w-full px-4 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-yellow-400 focus:border-yellow-400"
        required
      />
    </div>

    <div>
      <label for="id_password" class="block text-gray-700 font-semibold mb-1">Password</label>
      <input
        type="password"
        name="password"
        id="id_password"
        class="w-full px-4 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-yellow-400 focus:border-yellow-400"
        required
      />
    </div>

    <button
      type="submit"
      class="w-full bg-yellow-500 hover:bg-yellow-600 text-white font-bold py-2.5 rounded transition duration-300"
    >
      Login
    </button>
  </form>

  <p class="text-center text-sm mt-5">
    Don't have an account?
    <a href="{% url 'register' %}" class="text-yellow-600 hover:underline font-medium">Register</a>
  </p>
</div>

{% endblock %}
