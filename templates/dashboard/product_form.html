{% extends "base.html" %}
{% block title %} {{ title }} {% endblock %}

{% block body %}
{% include "components/navbar.html" with active="dashboard" %}

<div class="max-w-xl mx-auto py-10 px-4">
  <h1 class="text-2xl font-bold mb-6">{{ title }}</h1>

  <form method="POST" enctype="multipart/form-data" class="space-y-6">
    {% csrf_token %}
    {{ form }}
    <button type="submit" class="bg-yellow-400 hover:bg-yellow-500 text-white font-semibold px-4 py-2 rounded transition">
      Save
    </button>
  </form>
</div>
{% endblock %}
